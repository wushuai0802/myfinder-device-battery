name: 设备适配反馈
description: 反馈设备电量、重复连接或未取得电量的问题，帮助确认型号和协议范围
title: "[设备适配] 品牌与型号"
body:
  - type: markdown
    attributes:
      value: |
        可点击“状态与诊断”中的“反馈到 GitHub”，预填本表并复制完整反馈报告；预填失败或显示“已截断”时，可粘贴剪贴板中的完整报告。
        报告仅包含版本、设备原始名称与电量、明确匹配的型号级 VID:PID、隐藏连接、未取得电量的设备与异常读取器状态，不含用户别名、音频端点、进程/实例身份、路径或序列号。
        提交前可检查内容；提交需要 GitHub 账号。未取得电量可能是尚未适配，也可能是设备休眠。
  - type: input
    id: model
    attributes:
      label: 品牌与完整型号
      placeholder: 例如 ATK A9 Air（如知道，请补充固件版本）
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: 本次连接方式
      options:
        - 2.4G 接收器
        - 有线 USB
        - 蓝牙
    validations:
      required: true
  - type: input
    id: official-battery
    attributes:
      label: 官方软件显示的电量
      description: 请填写读数及是否充电；官方软件也没有读数时请说明。
      placeholder: 例如 75%，未充电；或官方软件未识别
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 反馈报告
      description: 移动或唤醒设备后重新同步，再点击“反馈到 GitHub”；检查预填内容，必要时粘贴完整报告。请勿粘贴含本机实例信息的普通诊断摘要。
      render: text
    validations:
      required: true
