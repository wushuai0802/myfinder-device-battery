name: Windows build and regression checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0, Node 24
        with:
          python-version: '3.14'
      - name: Run device protocol fixtures without hidapi
        run: python -I -B -m unittest discover -s ./engine/tests -q
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Build and run isolated checks
        shell: powershell
        run: ./scripts/Build.ps1 -OutputDirectory "$env:RUNNER_TEMP/device-battery-build"
      - name: Measure isolated rendering and repeated interaction lifecycle
        shell: powershell
        run: ./tests/Run-Performance.ps1 -OutputDirectory "$env:RUNNER_TEMP/device-battery-performance" -Animate
      - name: Build portable device reader and run protocol fixtures
        shell: powershell
        run: |
          ./scripts/Build-Backend.ps1 -OutputDirectory ./engine/runtime
          & ./engine/runtime/python.exe -I -B -m unittest discover -s ./tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Universal engine tests failed.' }
          & ./engine/runtime/python.exe -I -B -m unittest discover -s ./engine/tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Device protocol tests failed.' }
      - name: Package the validated build without rebuilding
        shell: powershell
        run: ./scripts/Package.ps1 -SkipBuild -BuildDirectory "$env:RUNNER_TEMP/device-battery-build" -OutputDirectory "$env:RUNNER_TEMP/device-battery-release"
      - name: Verify the final ZIP with an isolated real application and reader
        shell: powershell
        run: |
          $zip = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/device-battery-release" -Filter '*.zip' -File
          if (@($zip).Count -ne 1) { throw 'Expected exactly one final release ZIP.' }
          ./tests/PackageSmoke.ps1 -ZipPath $zip.FullName -OutputDirectory "$env:RUNNER_TEMP/device-battery-package-smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: windows-x64-complete-package
          path: |
            ${{ runner.temp }}/device-battery-release/*.zip
            ${{ runner.temp }}/device-battery-release/SHA256SUMS.txt
            ${{ runner.temp }}/device-battery-release/*/package-manifest.json
            ${{ runner.temp }}/device-battery-release/*/engine/dependencies.lock.json
            ${{ runner.temp }}/device-battery-build/appearance-preview.png
            ${{ runner.temp }}/device-battery-package-smoke/**/package-smoke-result.json
            ${{ runner.temp }}/device-battery-performance/*.json
            ${{ runner.temp }}/device-battery-performance/*.csv
          if-no-files-found: error
