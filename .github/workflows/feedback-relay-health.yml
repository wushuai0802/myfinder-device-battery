name: Feedback relay health

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the relay and report the result
        shell: bash
        run: python3 -I -B tools/issue-watch/issue_digest.py --feedback-relay-only | tee -a "$GITHUB_STEP_SUMMARY"
