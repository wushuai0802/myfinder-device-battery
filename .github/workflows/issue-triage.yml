name: Rule-based issue triage

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-triage-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      !github.event.issue.pull_request &&
      (github.event_name != 'issue_comment' ||
       (github.event.comment.user.type != 'Bot' && github.event.comment.user.login != 'github-actions[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - name: Index known IDs without loading providers
        run: python -I -B engine/known_ids.py --json > "$RUNNER_TEMP/known-ids.json"
      - name: Fetch current issue and all comments, then decide
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          gh api --paginate --slurp "repos/$GH_REPO/issues/$ISSUE_NUMBER/comments?per_page=100" > "$RUNNER_TEMP/comments.json"
          python -I -B .github/scripts/triage.py --issue "$RUNNER_TEMP/issue.json" --comments "$RUNNER_TEMP/comments.json" --known-ids "$RUNNER_TEMP/known-ids.json" > "$RUNNER_TEMP/decision.json"
      - name: Replace triage labels and post the template once
        shell: bash
        run: |
          set -euo pipefail
          # Re-fetch immediately before mutation: respect a newly added lock and
          # comments posted since the first snapshot (including our own marker).
          gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          gh api --paginate --slurp "repos/$GH_REPO/issues/$ISSUE_NUMBER/comments?per_page=100" > "$RUNNER_TEMP/comments.json"
          python -I -B .github/scripts/triage.py --issue "$RUNNER_TEMP/issue.json" --comments "$RUNNER_TEMP/comments.json" --known-ids "$RUNNER_TEMP/known-ids.json" > "$RUNNER_TEMP/decision.json"
          label=$(jq -r '.label // empty' "$RUNNER_TEMP/decision.json")
          case "$label" in
            '') exit 0 ;;
            triage:needs-info) color=D876E3 ;;
            triage:supported) color=0E8A16 ;;
            triage:pack-candidate) color=1D76DB ;;
            triage:insufficient-evidence) color=FBCA04 ;;
            triage:new-vendor) color=5319E7 ;;
            triage:bug) color=D73A4A ;;
            *) exit 1 ;;
          esac
          # --force is idempotent when the label already exists. Retry once.
          gh label create "$label" --repo "$GH_REPO" --color "$color" --force ||
            gh label create "$label" --repo "$GH_REPO" --color "$color" --force
          jq '{labels: [.label]}' "$RUNNER_TEMP/decision.json" > "$RUNNER_TEMP/add-label.json"
          gh api --method POST "repos/$GH_REPO/issues/$ISSUE_NUMBER/labels" --input "$RUNNER_TEMP/add-label.json" > /dev/null
          # Encode each exact label; commas/newlines must not become a list of
          # labels. Incremental operations preserve unrelated maintainer labels.
          while IFS= read -r old; do
            gh api --method DELETE "repos/$GH_REPO/issues/$ISSUE_NUMBER/labels/$old" > /dev/null
          done < <(jq -r '.remove_labels[] | @uri' "$RUNNER_TEMP/decision.json")
          if jq -e '.reply != null' "$RUNNER_TEMP/decision.json" > /dev/null; then
            jq -r '.reply' "$RUNNER_TEMP/decision.json" > "$RUNNER_TEMP/reply.txt"
            gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file "$RUNNER_TEMP/reply.txt"
          fi
